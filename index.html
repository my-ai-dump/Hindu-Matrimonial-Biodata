<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hindu Matrimonial Biodata Generator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #2c3e50;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
            animation: fadeInDown 0.6s ease-out;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #2c3e50;
            letter-spacing: 1px;
        }

        .header-subtitle {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 1rem;
        }

        .om-symbol {
            font-size: 48px;
            margin-bottom: 1rem;
            animation: pulse 2s ease-in-out infinite;
            color: #d4af37;
        }

        .form-section {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            animation: slideInUp 0.6s ease-out;
            border-left: 4px solid #d4af37;
        }

        .form-section h2 {
            font-size: 16px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-section h2 i {
            color: #d4af37;
            font-size: 18px;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 0.5rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select, textarea {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #ecf0f1;
            border-radius: 6px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
            background: white;
            color: #2c3e50;
            transition: all 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
            background: #fffef5;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        .button-group {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 140px;
            padding: 0.875rem 1.25rem;
            border: 2px solid #d4af37;
            border-radius: 6px;
            background: white;
            color: #d4af37;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button:hover {
            background: #f9f5f0;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.2);
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: linear-gradient(135deg, #d4af37 0%, #f0e68c 100%);
            color: #2c3e50;
            border-color: #d4af37;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #f0e68c 0%, #d4af37 100%);
        }

        .biodata-preview {
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            padding: 2.5rem;
            margin-top: 2rem;
            animation: fadeIn 0.8s ease-out;
        }

        .biodata-header {
            text-align: center;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 1.5rem;
            margin-bottom: 2rem;
        }

        .biodata-header .om {
            font-size: 48px;
            margin-bottom: 0.5rem;
            color: #d4af37;
        }

        .biodata-header h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #2c3e50;
        }

        .biodata-header p {
            color: #7f8c8d;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .biodata-section {
            margin-bottom: 2rem;
        }

        .biodata-section h3 {
            font-size: 14px;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid #d4af37;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .biodata-row {
            display: grid;
            grid-template-columns: 150px 1fr;
            gap: 1rem;
            margin-bottom: 0.75rem;
            font-size: 14px;
            padding: 0.5rem 0;
        }

        .biodata-label {
            font-weight: 700;
            color: #d4af37;
        }

        .biodata-value {
            color: #2c3e50;
            line-height: 1.5;
        }

        .hidden {
            display: none;
        }

        .success-message {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            color: white;
            padding: 1rem;
            border-radius: 6px;
            margin: 1rem 0;
            animation: slideInDown 0.4s ease-out;
            font-weight: 600;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #ecf0f1;
            flex-wrap: wrap;
        }

        .tab-btn {
            border: none;
            background: transparent;
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            font-size: 14px;
            color: #7f8c8d;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            min-width: 0;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tab-btn:hover {
            color: #d4af37;
        }

        .tab-btn.active {
            color: #d4af37;
            border-bottom-color: #d4af37;
            background: transparent;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .toggle-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .toggle-btn {
            flex: 1;
            padding: 0.75rem;
            border: 2px solid #ecf0f1;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s ease;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #555;
        }

        .toggle-btn:hover {
            border-color: #d4af37;
            color: #d4af37;
        }

        .toggle-btn.active {
            background: linear-gradient(135deg, #d4af37 0%, #f0e68c 100%);
            color: #2c3e50;
            border-color: #d4af37;
            font-weight: 700;
        }

        .gradient-line {
            height: 3px;
            background: linear-gradient(90deg, #d4af37, #27ae60, #e74c3c);
            border-radius: 2px;
            margin: 1rem 0;
        }

        .print-button {
            background: white;
            color: #d4af37;
            border: 2px solid #d4af37;
        }

        .print-button:hover {
            background: #f9f5f0;
        }

        @media print {
            body {
                background: white;
            }
            .button-group, .tabs, .tab-btn, .toggle-group, .header {
                display: none;
            }
            .biodata-preview {
                box-shadow: none;
                padding: 0;
            }
        }

        .share-icon {
            color: #25d366;
        }

        .download-icon {
            color: #d4af37;
        }

        .copy-icon {
            color: #3498db;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="om-symbol">ॐ</div>
        <h1>Hindu Matrimonial Biodata</h1>
        <p class="header-subtitle">✨ Create Your Perfect Biodata in Minutes ✨</p>
        <div class="gradient-line"></div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(event, 'form')">
            <i class="fas fa-edit"></i> Create Biodata
        </button>
        <button class="tab-btn" onclick="switchTab(event, 'preview')">
            <i class="fas fa-eye"></i> Preview
        </button>
    </div>

    <div id="form-tab" class="tab-content active">
        <div class="form-section" style="border-left: 4px solid #3498db;">
            <h2><i class="fas fa-mars"></i> Select Profile Type</h2>
            <div class="toggle-group" id="genderToggle">
                <button class="toggle-btn active" onclick="setGender(event, 'male')">
                    <i class="fas fa-mars"></i> Male (Groom)
                </button>
                <button class="toggle-btn" onclick="setGender(event, 'female')">
                    <i class="fas fa-venus"></i> Female (Bride)
                </button>
            </div>
        </div>

        <!-- Personal Information -->
        <div class="form-section">
            <h2><i class="fas fa-user-circle"></i> Personal Information</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" id="fullName" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label>Age *</label>
                    <input type="number" id="age" placeholder="Age" min="18" max="100" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Height (in feet)</label>
                    <input type="text" id="height" placeholder="e.g., 5'6&quot;">
                </div>
                <div class="form-group">
                    <label>Weight (in kg)</label>
                    <input type="number" id="weight" placeholder="Weight in kg">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Complexion</label>
                    <select id="complexion">
                        <option value="">Select...</option>
                        <option value="Fair">Fair</option>
                        <option value="Wheatish">Wheatish</option>
                        <option value="Dusky">Dusky</option>
                        <option value="Dark">Dark</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Body Type</label>
                    <select id="bodyType">
                        <option value="">Select...</option>
                        <option value="Slim">Slim</option>
                        <option value="Average">Average</option>
                        <option value="Athletic">Athletic</option>
                        <option value="Heavy">Heavy</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Astrological Details -->
        <div class="form-section">
            <h2><i class="fas fa-star"></i> Astrological Details</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>Date of Birth</label>
                    <input type="date" id="dob">
                </div>
                <div class="form-group">
                    <label>Time of Birth</label>
                    <input type="time" id="tob">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Place of Birth</label>
                    <input type="text" id="pob" placeholder="City, State">
                </div>
                <div class="form-group">
                    <label>Rashi (Moon Sign)</label>
                    <select id="rashi">
                        <option value="">Select...</option>
                        <option value="Aries">Aries (Mesh)</option>
                        <option value="Taurus">Taurus (Vrishabh)</option>
                        <option value="Gemini">Gemini (Mithun)</option>
                        <option value="Cancer">Cancer (Kark)</option>
                        <option value="Leo">Leo (Simha)</option>
                        <option value="Virgo">Virgo (Kanya)</option>
                        <option value="Libra">Libra (Tula)</option>
                        <option value="Scorpio">Scorpio (Vrishchik)</option>
                        <option value="Sagittarius">Sagittarius (Dhanu)</option>
                        <option value="Capricorn">Capricorn (Makara)</option>
                        <option value="Aquarius">Aquarius (Kumbha)</option>
                        <option value="Pisces">Pisces (Meen)</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Nakshatra (Birth Star)</label>
                    <input type="text" id="nakshatra" placeholder="Your birth star">
                </div>
                <div class="form-group">
                    <label>Gotra (Family Lineage)</label>
                    <input type="text" id="gotra" placeholder="Family lineage">
                </div>
            </div>
        </div>

        <!-- Family Details -->
        <div class="form-section">
            <h2><i class="fas fa-home"></i> Family Details</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>Father's Name</label>
                    <input type="text" id="fatherName" placeholder="Father's full name">
                </div>
                <div class="form-group">
                    <label>Father's Occupation</label>
                    <input type="text" id="fatherOcc" placeholder="Occupation">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Mother's Name</label>
                    <input type="text" id="motherName" placeholder="Mother's full name">
                </div>
                <div class="form-group">
                    <label>Mother's Occupation</label>
                    <input type="text" id="motherOcc" placeholder="Occupation">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Residence</label>
                    <input type="text" id="residence" placeholder="City, State">
                </div>
                <div class="form-group">
                    <label>Family Status</label>
                    <select id="familyStatus">
                        <option value="">Select...</option>
                        <option value="Upper Middle Class">Upper Middle Class</option>
                        <option value="Middle Class">Middle Class</option>
                        <option value="Lower Middle Class">Lower Middle Class</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Education & Career -->
        <div class="form-section">
            <h2><i class="fas fa-graduation-cap"></i> Education & Career</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>Education *</label>
                    <input type="text" id="education" placeholder="e.g., B.Tech (Computer Science)">
                </div>
                <div class="form-group">
                    <label>Occupation *</label>
                    <input type="text" id="occupation" placeholder="Current profession">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Annual Income</label>
                    <input type="text" id="income" placeholder="e.g., 15-20 LPA">
                </div>
                <div class="form-group">
                    <label>Work Location</label>
                    <input type="text" id="workLocation" placeholder="City/Country">
                </div>
            </div>
        </div>

        <!-- Personal & Religious Details -->
        <div class="form-section">
            <h2><i class="fas fa-heart"></i> Personal & Religious Details</h2>
            <div class="form-group">
                <label>Religion</label>
                <select id="religion">
                    <option value="">Select...</option>
                    <option value="Hindu">Hindu</option>
                </select>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Caste</label>
                    <input type="text" id="caste" placeholder="Caste">
                </div>
                <div class="form-group">
                    <label>Sub-Caste</label>
                    <input type="text" id="subCaste" placeholder="Sub-caste">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Marital Status</label>
                    <select id="maritalStatus">
                        <option value="">Select...</option>
                        <option value="Never Married">Never Married</option>
                        <option value="Divorced">Divorced</option>
                        <option value="Widowed">Widowed</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Mangal Dosh</label>
                    <select id="mangalDosh">
                        <option value="">Select...</option>
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>About Yourself</label>
                <textarea id="about" placeholder="Tell us about yourself, your interests, hobbies, and what you're looking for in a life partner..."></textarea>
            </div>
        </div>

        <!-- Contact Details -->
        <div class="form-section">
            <h2><i class="fas fa-phone-alt"></i> Contact Details</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phone" placeholder="+91 xxxxx xxxxx">
                </div>
            </div>
        </div>

        <div class="button-group">
            <button class="btn-primary" onclick="generateBiodata()">
                <i class="fas fa-check"></i> Generate Biodata
            </button>
            <button onclick="resetForm()">
                <i class="fas fa-redo"></i> Clear Form
            </button>
        </div>
    </div>

    <div id="preview-tab" class="tab-content"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
let currentGender = 'male';

function setGender(event, gender) {
    currentGender = gender;
    document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
    event.target.closest('button').classList.add('active');
}

function switchTab(event, tab) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    
    document.getElementById(tab + '-tab').classList.add('active');
    event.target.closest('button').classList.add('active');
}

function getFormData() {
    return {
        gender: currentGender,
        fullName: document.getElementById('fullName').value,
        age: document.getElementById('age').value,
        height: document.getElementById('height').value,
        weight: document.getElementById('weight').value,
        complexion: document.getElementById('complexion').value,
        bodyType: document.getElementById('bodyType').value,
        dob: document.getElementById('dob').value,
        tob: document.getElementById('tob').value,
        pob: document.getElementById('pob').value,
        rashi: document.getElementById('rashi').value,
        nakshatra: document.getElementById('nakshatra').value,
        gotra: document.getElementById('gotra').value,
        fatherName: document.getElementById('fatherName').value,
        fatherOcc: document.getElementById('fatherOcc').value,
        motherName: document.getElementById('motherName').value,
        motherOcc: document.getElementById('motherOcc').value,
        residence: document.getElementById('residence').value,
        familyStatus: document.getElementById('familyStatus').value,
        education: document.getElementById('education').value,
        occupation: document.getElementById('occupation').value,
        income: document.getElementById('income').value,
        workLocation: document.getElementById('workLocation').value,
        religion: document.getElementById('religion').value,
        caste: document.getElementById('caste').value,
        subCaste: document.getElementById('subCaste').value,
        maritalStatus: document.getElementById('maritalStatus').value,
        mangalDosh: document.getElementById('mangalDosh').value,
        about: document.getElementById('about').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value
    };
}

function generateBiodata() {
    const data = getFormData();
    
    if (!data.fullName || !data.age || !data.education || !data.occupation) {
        alert('⚠️ Please fill in all required fields:\n- Full Name\n- Age\n- Education\n- Occupation');
        return;
    }

    const html = `
        <div class="biodata-preview">
            <div class="biodata-header">
                <div class="om">ॐ</div>
                <h2>${data.fullName}</h2>
                <p>${data.gender === 'male' ? '👨 Matrimonial Profile - Groom' : '👩 Matrimonial Profile - Bride'}</p>
            </div>

            <div class="biodata-section">
                <h3>📋 Personal Information</h3>
                <div class="biodata-row"><span class="biodata-label">Age</span><span class="biodata-value">${data.age} years</span></div>
                <div class="biodata-row"><span class="biodata-label">Height</span><span class="biodata-value">${data.height || 'N/A'}</span></div>
                <div class="biodata-row"><span class="biodata-label">Weight</span><span class="biodata-value">${data.weight ? data.weight + ' kg' : 'N/A'}</span></div>
                <div class="biodata-row"><span class="biodata-label">Complexion</span><span class="biodata-value">${data.complexion || 'N/A'}</span></div>
                <div class="biodata-row"><span class="biodata-label">Body Type</span><span class="biodata-value">${data.bodyType || 'N/A'}</span></div>
            </div>

            ${data.dob || data.rashi ? `
            <div class="biodata-section">
                <h3>⭐ Astrological Details</h3>
                ${data.dob ? `<div class="biodata-row"><span class="biodata-label">Date of Birth</span><span class="biodata-value">${data.dob}</span></div>` : ''}
                ${data.tob ? `<div class="biodata-row"><span class="biodata-label">Time of Birth</span><span class="biodata-value">${data.tob}</span></div>` : ''}
                ${data.pob ? `<div class="biodata-row"><span class="biodata-label">Place of Birth</span><span class="biodata-value">${data.pob}</span></div>` : ''}
                ${data.rashi ? `<div class="biodata-row"><span class="biodata-label">Rashi (Moon Sign)</span><span class="biodata-value">${data.rashi}</span></div>` : ''}
                ${data.nakshatra ? `<div class="biodata-row"><span class="biodata-label">Nakshatra (Birth Star)</span><span class="biodata-value">${data.nakshatra}</span></div>` : ''}
                ${data.gotra ? `<div class="biodata-row"><span class="biodata-label">Gotra</span><span class="biodata-value">${data.gotra}</span></div>` : ''}
            </div>
            ` : ''}

            ${data.fatherName || data.motherName ? `
            <div class="biodata-section">
                <h3>👨‍👩‍👧‍👦 Family Background</h3>
                ${data.fatherName ? `<div class="biodata-row"><span class="biodata-label">Father</span><span class="biodata-value">${data.fatherName} ${data.fatherOcc ? '(' + data.fatherOcc + ')' : ''}</span></div>` : ''}
                ${data.motherName ? `<div class="biodata-row"><span class="biodata-label">Mother</span><span class="biodata-value">${data.motherName} ${data.motherOcc ? '(' + data.motherOcc + ')' : ''}</span></div>` : ''}
                ${data.residence ? `<div class="biodata-row"><span class="biodata-label">Residence</span><span class="biodata-value">${data.residence}</span></div>` : ''}
                ${data.familyStatus ? `<div class="biodata-row"><span class="biodata-label">Family Status</span><span class="biodata-value">${data.familyStatus}</span></div>` : ''}
            </div>
            ` : ''}

            <div class="biodata-section">
                <h3>🎓 Education & Career</h3>
                <div class="biodata-row"><span class="biodata-label">Education</span><span class="biodata-value">${data.education}</span></div>
                <div class="biodata-row"><span class="biodata-label">Occupation</span><span class="biodata-value">${data.occupation}</span></div>
                ${data.income ? `<div class="biodata-row"><span class="biodata-label">Annual Income</span><span class="biodata-value">${data.income}</span></div>` : ''}
                ${data.workLocation ? `<div class="biodata-row"><span class="biodata-label">Work Location</span><span class="biodata-value">${data.workLocation}</span></div>` : ''}
            </div>

            <div class="biodata-section">
                <h3>💫 Personal & Religious Details</h3>
                ${data.religion ? `<div class="biodata-row"><span class="biodata-label">Religion</span><span class="biodata-value">${data.religion}</span></div>` : ''}
                ${data.caste ? `<div class="biodata-row"><span class="biodata-label">Caste</span><span class="biodata-value">${data.caste}</span></div>` : ''}
                ${data.subCaste ? `<div class="biodata-row"><span class="biodata-label">Sub-Caste</span><span class="biodata-value">${data.subCaste}</span></div>` : ''}
                ${data.maritalStatus ? `<div class="biodata-row"><span class="biodata-label">Marital Status</span><span class="biodata-value">${data.maritalStatus}</span></div>` : ''}
                ${data.mangalDosh ? `<div class="biodata-row"><span class="biodata-label">Mangal Dosh</span><span class="biodata-value">${data.mangalDosh}</span></div>` : ''}
            </div>

            ${data.about ? `
            <div class="biodata-section">
                <h3>📝 About</h3>
                <div style="color: #2c3e50; font-size: 14px; line-height: 1.8; padding: 0.5rem 0; white-space: pre-wrap;">${escapeHtml(data.about)}</div>
            </div>
            ` : ''}

            ${data.email || data.phone ? `
            <div class="biodata-section">
                <h3>📞 Contact Information</h3>
                ${data.email ? `<div class="biodata-row"><span class="biodata-label">Email</span><span class="biodata-value">${data.email}</span></div>` : ''}
                ${data.phone ? `<div class="biodata-row"><span class="biodata-label">Phone</span><span class="biodata-value">${data.phone}</span></div>` : ''}
            </div>
            ` : ''}

            <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 2px solid #ecf0f1;">
                <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                    <button class="btn-primary" onclick="copyToClipboard()" style="flex: 1; min-width: 140px;">
                        <i class="fas fa-copy copy-icon"></i> Copy for WhatsApp
                    </button>
                    <button class="print-button" onclick="downloadPDF()" style="flex: 1; min-width: 140px;">
                        <i class="fas fa-file-pdf download-icon"></i> Download PDF
                    </button>
                    <button class="print-button" onclick="shareWhatsApp()" style="flex: 1; min-width: 140px;">
                        <i class="fab fa-whatsapp share-icon"></i> Share WhatsApp
                    </button>
                    <button class="print-button" onclick="window.print()" style="flex: 1; min-width: 140px;">
                        <i class="fas fa-print"></i> Print
                    </button>
                </div>
            </div>
        </div>
    `;

    document.getElementById('preview-tab').innerHTML = html;
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById('preview-tab').classList.add('active');
    document.querySelectorAll('.tab-btn')[1].classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function copyToClipboard() {
    const data = getFormData();
    const text = generatePlainText(data);
    navigator.clipboard.writeText(text).then(() => {
        alert('✅ Biodata copied to clipboard!\n\n📱 You can now paste it on WhatsApp, Email, or other messaging apps.');
    }).catch(() => {
        alert('❌ Failed to copy. Please try again.');
    });
}

function shareWhatsApp() {
    const data = getFormData();
    const text = generatePlainText(data);
    const whatsappUrl = 'https://wa.me/?text=' + encodeURIComponent(text);
    window.open(whatsappUrl, '_blank');
}

function downloadPDF() {
    const data = getFormData();
    const element = document.querySelector('.biodata-preview');
    const opt = {
        margin: 10,
        filename: `${data.fullName}_Biodata.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { orientation: 'portrait', unit: 'mm', format: 'a4' }
    };
    html2pdf().set(opt).save(opt.filename).from(element).save();
    alert('✅ PDF is being downloaded!');
}

function generatePlainText(data) {
    let text = `🔔 MATRIMONIAL BIODATA 🔔\n`;
    text += `${'═'.repeat(55)}\n\n`;
    text += `ॐ ${data.fullName}\n`;
    text += `${data.gender === 'male' ? '👨 GROOM' : '👩 BRIDE'}\n\n`;
    
    text += `📋 PERSONAL INFORMATION\n`;
    text += `${'─'.repeat(55)}\n`;
    text += `Age: ${data.age} years\n`;
    if(data.height) text += `Height: ${data.height}\n`;
    if(data.weight) text += `Weight: ${data.weight} kg\n`;
    if(data.complexion) text += `Complexion: ${data.complexion}\n`;
    if(data.bodyType) text += `Body Type: ${data.bodyType}\n`;
    text += `\n`;
    
    if(data.dob || data.rashi) {
        text += `⭐ ASTROLOGICAL DETAILS\n`;
        text += `${'─'.repeat(55)}\n`;
        if(data.dob) text += `📅 Date of Birth: ${data.dob}\n`;
        if(data.tob) text += `🕐 Time of Birth: ${data.tob}\n`;
        if(data.pob) text += `📍 Place of Birth: ${data.pob}\n`;
        if(data.rashi) text += `Rashi: ${data.rashi}\n`;
        if(data.nakshatra) text += `Nakshatra: ${data.nakshatra}\n`;
        if(data.gotra) text += `Gotra: ${data.gotra}\n`;
        text += `\n`;
    }
    
    if(data.fatherName || data.motherName) {
        text += `👨‍👩‍👧‍👦 FAMILY BACKGROUND\n`;
        text += `${'─'.repeat(55)}\n`;
        if(data.fatherName) text += `👨 Father: ${data.fatherName}${data.fatherOcc ? ' (' + data.fatherOcc + ')' : ''}\n`;
        if(data.motherName) text += `👩 Mother: ${data.motherName}${data.motherOcc ? ' (' + data.motherOcc + ')' : ''}\n`;
        if(data.residence) text += `📍 Residence: ${data.residence}\n`;
        if(data.familyStatus) text += `Status: ${data.familyStatus}\n`;
        text += `\n`;
    }
    
    text += `🎓 EDUCATION & CAREER\n`;
    text += `${'─'.repeat(55)}\n`;
    text += `Education: ${data.education}\n`;
    text += `Occupation: ${data.occupation}\n`;
    if(data.income) text += `Annual Income: ${data.income}\n`;
    if(data.workLocation) text += `Work Location: ${data.workLocation}\n`;
    text += `\n`;
    
    text += `💫 PERSONAL & RELIGIOUS DETAILS\n`;
    text += `${'─'.repeat(55)}\n`;
    if(data.religion) text += `Religion: ${data.religion}\n`;
    if(data.caste) text += `Caste: ${data.caste}\n`;
    if(data.subCaste) text += `Sub-Caste: ${data.subCaste}\n`;
    if(data.maritalStatus) text += `Marital Status: ${data.maritalStatus}\n`;
    if(data.mangalDosh) text += `Mangal Dosh: ${data.mangalDosh}\n`;
    text += `\n`;
    
    if(data.about) {
        text += `📝 ABOUT\n`;
        text += `${'─'.repeat(55)}\n`;
        text += `${data.about}\n\n`;
    }
    
    text += `📞 CONTACT INFORMATION\n`;
    text += `${'─'.repeat(55)}\n`;
    if(data.email) text += `Email: ${data.email}\n`;
    if(data.phone) text += `Phone: ${data.phone}\n`;
    text += `\n`;
    text += `${'═'.repeat(55)}\n`;
    text += `📱 Created with Hindu Matrimonial Biodata Generator\n`;
    text += `💕 Wish You A Happy Marriage Life! 💕`;
    
    return text;
}

function escapeHtml(text) {
    const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
    };
    return text.replace(/[&<>"']/g, m => map[m]);
}

function resetForm() {
    document.querySelectorAll('input, select, textarea').forEach(el => {
        el.value = '';
    });
    currentGender = 'male';
    document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelector('.toggle-btn').classList.add('active');
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById('form-tab').classList.add('active');
    document.querySelector('.tab-btn').classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
